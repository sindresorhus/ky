name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - latest
          - 24
          - 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npx ava 'test/**' '!test/browser.ts'
  # The browser tests, linting, build, and type checks do not depend on the Node.js version, so they run only once.
  browser:
    name: Browsers and static checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # The file argument goes to `ava`, so it must stay the last command in the `test` script.
      - run: npm test -- test/browser.ts
